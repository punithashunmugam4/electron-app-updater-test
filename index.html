<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Browser-app</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      window.onload = function () {
        // var url = "https://moviesmod.army/";
        var url = "home.html";
        document.querySelector(".address-bar").value = url;
        document.querySelector(".tab-content-frame").src = url;
        document.querySelector(".tab.active").setAttribute("data-url", url);

        if (window.electron && typeof window.electron.invoke === "function") {
          window.electron
            .invoke("get-app-version")
            .then((version) => {
              document.title = `Browser-app v${version}`;
              document.querySelector(".title-text").textContent =
                `Orbit Browser v${version}`;
            })
            .catch((err) => {
              console.warn("Failed to read app version:", err);
            });
        }
      };
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
    />
  </head>
  <body>
    <header class="browser-header">
      <div class="header-top-row">
        <div class="app-title">
          <span class="material-symbols-outlined title-icon">explore</span>
          <span class="title-text">Orbit Browser</span>
        </div>

        <div class="window-controls">
          <button class="control-btn" id="min-btn">
            <span class="material-symbols-outlined">minimize</span>
          </button>
          <button class="control-btn" id="max-btn" data-state="maximized">
            <span class="material-symbols-outlined max-icon">crop_square</span>
            <span class="material-symbols-outlined restore-icon"
              >flip_to_front</span
            >
          </button>
          <button class="control-btn close-btn" id="close-btn">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>
      <div class="header-bottom-row">
        <div class="tab-bar">
          <div class="tab active" id="1" data-tab-id="1" data-url="">
            <span class="tab-title">Home</span>
            <button class="close-tab-btn">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
          <button class="add-tab-btn">
            <span class="material-symbols-outlined">add</span>
          </button>
        </div>
      </div>
    </header>
    <nav class="nav-bar">
      <div class="nav-buttons">
        <button class="nav-btn" id="back-btn">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <button class="nav-btn" id="forward-btn">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <button class="nav-btn" id="refresh-btn">
          <span class="material-symbols-outlined">refresh</span>
        </button>
      </div>
      <div class="address-bar-wrapper">
        <span class="material-symbols-outlined lock-icon">lock</span>
        <input
          type="text"
          class="address-bar"
          value=""
          placeholder="Search Google or type a URL"
        />
      </div>
      <div class="nav-buttons">
         <button class="nav-btn" title="Reset App" id="reset-app">
          <span class="material-symbols-outlined">home</span></button>
        <button id="interact-webview" class="nav-btn">
          <span class="material-symbols-outlined">smart_toy</span>
        </button>
        <button class="nav-btn" id="show-downloads">
          <span class="material-symbols-outlined">download</span>
        </button>
        <button id="theme-toggle" class="nav-btn">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
      </div>
    </nav>
    <main class="content-container">
      <div class="web-view-wrapper active">
        <webview
          preload="preload.cjs"
          tabindex="1"
          class="tab-content-frame active"
          id="frame-1"
          src=""
        ></webview>
      </div>
    </main>
    <script type="module" src="index.js"></script>

    <!-- Modal for download progress -->
    <div id="download-modal" class="modal">
      <span class="close-modal">&times;</span>
      <div class="modal-content">
        <h2>Download Progress</h2>
        <ul id="download-list"></ul>
      </div>
    </div>
    <button
      class="chat-widget-toggle"
      id="widget-toggle"
      title="Open Automation Console"
    >
      <span class="material-symbols-outlined">analytics</span>
    </button>

    <div class="chat-container" id="chat-window">
      <div class="chat-header">
        <div class="bot-profile">
          <div class="avatar">
            <span class="material-symbols-outlined">memory</span>
          </div>
          <div class="bot-info">
            <div class="bot-name">Orchestrator Core</div>
            <div class="bot-status" id="bot-status">None selected</div>
          </div>
        </div>
        <button class="close-chat-btn" id="close-chat" title="Hide Console">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="message-row bot">
          <div>
            <div class="bubble">
              Welcome to the Automation Core. Type the name or keyword of a bot.
            </div>
            <span class="timestamp">Just now</span>
          </div>
        </div>
      </div>

      <div class="chat-footer">
        <form id="chat-form">
          <div class="input-wrapper">
            <input
              type="text"
              id="user-input"
              class="chat-input"
              placeholder="Type bot name (e.g., initialization, validation)..."
              autocomplete="off"
            />
            <button type="submit" class="send-btn" title="Send request">
              <span class="material-symbols-outlined">arrow_forward</span>
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="downloads.cjs"></script>
    <script src="chatbot.js"></script>
  </body>
</html>
